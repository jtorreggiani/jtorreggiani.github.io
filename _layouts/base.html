<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>{% if page.title %}{{ page.title }} | {{ site.name }}{% else %}{{ site.name }} — {{ site.skills }}{% endif %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% assign page_description = page.description | default: site.description %}
    <meta name="description" content="{{ page_description }}">
    <meta name="keywords" content="{{ site.keywords }}">
    <meta name="author" content="{{ site.name }}">
    <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.canonical_url }}">
{% if site.blog_enabled %}
    <link rel="alternate" type="application/atom+xml" title="{{ site.name }} — posts" href="{{ '/feed.xml' | prepend: site.canonical_url }}">{% endif %}

    <!-- Match the browser UI to the active theme -->
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">

    <!-- Social previews -->
    <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
    <meta property="og:site_name" content="{{ site.name }}">
    <meta property="og:title" content="{% if page.title %}{{ page.title }} | {{ site.name }}{% else %}{{ site.name }}{% endif %}">
    <meta property="og:description" content="{{ page_description }}">
    <meta property="og:url" content="{{ page.url | replace:'index.html','' | prepend: site.canonical_url }}">
    <meta name="twitter:card" content="summary">

    <!-- Theme (prevent flash of wrong theme). Also marks the document as
         script-enabled so progressive enhancements never hide content. -->
    <script>
      (function() {
        var root = document.documentElement;
        root.classList.add('js');
        var saved = null;
        try { saved = localStorage.getItem('theme'); } catch (e) {}
        if (saved === 'dark' || saved === 'light') {
          root.setAttribute('data-theme', saved);
        } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
          root.setAttribute('data-theme', 'dark');
        } else {
          root.setAttribute('data-theme', 'light');
        }
      })();
    </script>

    <!-- Styles -->
    <link rel="stylesheet" href="{{ site.baseurl }}/style.css">

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    {% if site.google_verify %}<meta name="google-site-verification" content="{{ site.google_verify }}">{% endif %}
    {% if site.bing_verify %}<meta name="msvalidate.01" content="{{ site.bing_verify }}">{% endif %}
  </head>
  <body id="page-top">
    <a class="skip-link" href="#main-content">Skip to content</a>

    {% include nav.html %}

    <main id="main-content" tabindex="-1">
      {{ content }}
    </main>

    {% include footer.html %}

    <script src="{{ site.baseurl }}/js/main.js"></script>
  </body>
</html>
