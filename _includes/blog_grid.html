<section class="section" id="blog" aria-labelledby="blog-heading">
  <div class="container">
    <h2 class="section-heading" id="blog-heading">Blog</h2>
    {% if site.posts.size > 0 %}
    <ul class="blog-grid" role="list">
      {% for post in site.posts limit:6 %}
      <li>
        <article class="blog-card">
          <time class="blog-card-date" datetime="{{ post.date | date_to_xmlschema }}">
            {{ post.date | date: "%B %-d, %Y" }}
          </time>
          <h3 class="blog-card-title">
            <a href="{{ post.url | prepend: site.baseurl }}">{{ post.title }}</a>
          </h3>
          <p class="blog-card-excerpt">{{ post.excerpt | strip_html | truncatewords: 30 }}</p>
        </article>
      </li>
      {% endfor %}
    </ul>
    {% else %}
    <p class="blog-empty">Posts coming soon.</p>
    {% endif %}
  </div>
</section>
