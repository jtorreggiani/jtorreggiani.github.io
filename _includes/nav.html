{% assign is_home = false %}
{% if page.url == "/" or page.url == "/index.html" %}{% assign is_home = true %}{% endif %}

<nav class="site-nav" id="site-nav" aria-label="Main">
  <div class="nav-container">
    <a class="nav-brand" href="{{ site.baseurl }}/"{% if is_home %} aria-current="page"{% endif %}>
      {{ site.name }}
    </a>

    <ul class="nav-links" id="nav-links" role="list">
      <li><a href="{{ site.baseurl }}/#about">About</a></li>
      {% if site.blog_enabled %}
      <li>
        <a href="{{ site.baseurl }}/#blog"{% if page.layout == "post" %} aria-current="page"{% endif %}>Blog</a>
      </li>
      {% endif %}
      <li>
        <a href="{{ site.baseurl }}/work/"{% if page.url contains "/work" %} aria-current="page"{% endif %}>Work</a>
      </li>
      <li>
        <a href="{{ site.baseurl }}/resume/"{% if page.url contains "/resume" %} aria-current="page"{% endif %}>Resume</a>
      </li>
      <li><a href="{{ site.baseurl }}/#contact">Contact</a></li>
    </ul>

    <div class="nav-actions">
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark mode">
        <svg class="theme-icon theme-icon--moon" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <svg class="theme-icon theme-icon--sun" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
      </button>
      <button class="nav-toggle" id="nav-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="nav-links">
        <span class="nav-toggle-icon" aria-hidden="true"></span>
      </button>
    </div>
  </div>
</nav>
